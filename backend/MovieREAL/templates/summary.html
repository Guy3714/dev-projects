<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Booking Summary</title>
</head>
<body>
    <h1>Movie Booking Summary</h1>

    <p>Customer: {{ customer }}</p>
    <p>Movie: {{ movie }}</p>
    <p>Ticket Type: {{ ticket_type }}</p>
    <p>Tickets: {{ tickets }}</p>

    <p>Ticket Cost: ₹{{ ticket_cost }}</p>
    <p>Snacks: {{ snacks }}</p>
    <p>Snack Cost: ₹{{ snack_cost }}</p>

    <h2>Total: ₹{{ total }}</h2>
</body>
</html>
