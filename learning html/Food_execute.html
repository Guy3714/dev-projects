<html>
    <head><title>Food order</title></head>
    <body>
        <form>
        <label>Name</label>
        <input type="text" placeholder="Write your name here!" required><br>
        <label>Age</label>
        <input type="number" placeholder="26" required><br>
        <label>Pizza Size</label><br>
        <label>Small</label>
        <input type="radio" required value="Small" name="size">
        <label>Medium</label>
        <input type="radio" required value="medium" name="size">
        <label>Large</label>
        <input type="radio" required value="large" name="size"><br>
        <label>Toppings</label><br>
        <label>Cheese</label>
        <input type="checkbox"><br>
        <label>Veggies</label>
        <input type="checkbox"><br>
        <label>Pepperoni's</label>
        <input type="checkbox"><br>
        <br>
        <label>Address</label>
        <input type="textarea" required placeholder="7889 fiddlesticks "><br>
        <label>Payment method</label>
        <input type="number" required placeholder="1 or less=Cash,2 = UPI,3 or more=Credit card"><br>
        <label>Extra insturtions</label>
        <input type="textarea"><br>
        <label>Sumbit</label>
        <input type="submit" required>
        </form>
    </body>

</html>
